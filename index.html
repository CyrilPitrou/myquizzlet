<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyQuizzlet</title>
  <link rel="stylesheet" href="app/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#faf7f2">
  <script>
    // Runs before first paint. main.js is a module and therefore deferred, so
    // without this the app flashes the default theme on every launch.
    try {
      const saved = JSON.parse(localStorage.getItem('mq:settings') || '{}');
      if (saved.theme && saved.theme !== 'paper') document.documentElement.dataset.theme = saved.theme;
      if (saved.lang === 'fr') document.documentElement.lang = 'fr';
    } catch (error) { /* a corrupt settings blob is not worth a blank screen */ }
  </script>
</head>
<body>
  <header id="topbar">
    <a href="#/" class="nav icon" title="Lists" aria-label="Lists">🏠</a>
    <a href="#/folders" class="nav icon gap" title="Folders" aria-label="Folders">📁</a>
    <button id="lang" class="nav icon" type="button"></button>
    <button id="sync-dot" type="button" title="No token — read-only" disabled>⊘</button>
    <div id="more" class="nav">
      <button id="more-btn" class="icon" type="button" title="More" aria-label="More"
              aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">⋮</button>
      <div id="more-menu" role="menu" hidden>
        <a href="#/settings" role="menuitem"><span class="mi">⚙</span><span class="lbl">Settings</span></a>
        <a href="#/wishes" role="menuitem"><span class="mi">🪄</span><span class="lbl">Suggestions</span></a>
        <a href="#/help" role="menuitem"><span class="mi">?</span><span class="lbl">Help</span></a>
        <a href="#/new" role="menuitem"><span class="mi">＋</span><span class="lbl">Create a list</span></a>
      </div>
    </div>
  </header>
  <main id="screen"></main>
  <script type="module" src="app/main.js"></script>
</body>
</html>
