<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyQuizzlet</title>
  <link rel="stylesheet" href="app/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#faf7f2">
  <script>
    // Runs before first paint. main.js is a module and therefore deferred, so
    // without this the app flashes the default theme on every launch.
    try {
      const saved = JSON.parse(localStorage.getItem('mq:settings') || '{}');
      if (saved.theme && saved.theme !== 'paper') document.documentElement.dataset.theme = saved.theme;
      if (saved.lang === 'fr') document.documentElement.lang = 'fr';
    } catch (error) { /* a corrupt settings blob is not worth a blank screen */ }
  </script>
</head>
<body>
  <header id="topbar">
    <a href="#/new" class="nav icon" title="Create a list" aria-label="Create a list">＋</a>
    <a href="#/folders" class="nav" title="Folders">Folders</a>
    <a href="#/" class="nav" title="Lists">Lists</a>
    <a href="#/settings" class="nav icon" title="Settings" aria-label="Settings">⚙</a>
    <a href="#/help" class="nav icon" title="Help" aria-label="Help">?</a>
    <button id="lang" class="nav icon" type="button"></button>
    <span id="sync-dot" title="No token — read-only">⊘</span>
  </header>
  <main id="screen"></main>
  <script type="module" src="app/main.js"></script>
</body>
</html>
