name: Suggestions waiting

on:
  push:
    branches: [data]
    paths: ['data/suggestions.json']

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the box
        id: box
        run: |
          [ -f data/suggestions.json ] || exit 0
          text=$(jq -r '.text // ""' data/suggestions.json)
          if [ -n "${text//[$' \t\n\r']/}" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
          delim="WISH_EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            echo "$text"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.box.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.box.outputs.text }}
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title \
                     --jq '.[] | select(.title == "Suggestions waiting") | .number' | head -n1)
          body=$(printf 'The suggestion box is not empty:\n\n---\n\n%s\n\n---\n\nRun `let us review suggestions` to act on it.' "$BODY")
          owner='${{ github.repository_owner }}'
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
            gh issue comment "$number" --body 'The box changed. The text above is the current one.'
          else
            gh issue create --title 'Suggestions waiting' --body "$body" --assignee "$owner"
          fi
